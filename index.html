/* BauchFit mobile-first visual refresh inspired by the supplied reference */

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);const view=$('#view');const STORE='bauchfit10_state_v1';
const defaultState={settings:{countdown:true,sound:true,warmup:2,cooldown:3},challenge:{level:'Anfänger',length:30,startDate:null,done:[],history:[]},individual:{done:0,history:[]},active:null};
let state=loadState(), timerId=null, audioCtx=null;
if(!state.challenge.doneByLevel){
 const legacy=Array.isArray(state.challenge.done)?state.challenge.done.slice():[];
 state.challenge.doneByLevel={[state.challenge.level||'Anfänger']:legacy};
 state.challenge.done=legacy;
 save();
}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');return s?{...structuredClone(defaultState),...s,settings:{...defaultState.settings,...s.settings},challenge:{...defaultState.challenge,...s.challenge},individual:{...defaultState.individual,...s.individual}}:structuredClone(defaultState)}catch(e){return structuredClone(defaultState)}}
function completedDays(level=state.challenge.level){const by=state.challenge.doneByLevel||{};return Array.isArray(by[level])?by[level]:[]}
function markDayDone(day,level=state.challenge.level){state.challenge.doneByLevel=state.challenge.doneByLevel||{};state.challenge.doneByLevel[level]=completedDays(level);if(!state.challenge.doneByLevel[level].includes(day))state.challenge.doneByLevel[level].push(day);state.challenge.done=state.challenge.doneByLevel[level];}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));return true}catch(e){toast('Speichern nicht möglich. Bitte Speicherplatz prüfen.');return false}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function dateKey(d=new Date()){return d.toISOString().slice(0,10)}
function exerciseVisual(e){
 if(e?.phase==='rest') return `<div class="rest-visual" role="img" aria-label="Erholungspause"><div class="rest-orbit"><span>Ⅱ</span></div><strong>Kurze Erholung</strong><span>Atme ruhig und bereite dich auf die nächste Übung vor.</span></div>`;
 const id=e?.id||'';
 const imageById={
  'march':'standing','boxing-march':'standing','coolwalk':'standing','arms':'standing','sidestep':'standing',
  'kneelift':'knee-lift','march-high':'knee-lift','jacks':'jumping-jacks',
  'squat':'squat','squat-reach':'squat','burpee':'push-up',
  'deadbug':'dead-bug','reverse':'reverse-crunch','bicycle':'bicycle-crunch',
  'bridge':'glute-bridge','plank':'plank','mountain':'mountain-climber',
  'bird-dog':'bird-dog','bird-dog-2':'bird-dog','side-plank':'side-plank',
  'stretchside':'side-stretch','hipstretch':'lunge','backmob':'forward-fold'
 };
 Object.assign(imageById,{
  'v-ups':'reverse-crunch','extended-crunch':'cross-arm-crunch','heel-tap-crunch':'cross-arm-crunch','glute-kicks':'bird-dog','alternating-leg-raise':'leg-spread','kneeling-side-plank-left':'side-plank','kneeling-side-plank-right':'side-plank','side-leg-left':'side-leg-lift-left','side-leg-right':'side-leg-lift-right','cobra-stretch':'forward-fold','supine-twist':'twist-lying','elbow-knee-crunch':'bicycle-crunch','crossed-arm-crunch':'cross-arm-crunch','glute-bridge-hold':'glute-bridge','plank-knee-cross':'plank','dumbbell-side-bend':'standing','knee-twist':'twist-lying',
  'hollow-hold':'dead-bug','scissor-kicks':'bicycle-crunch','flutter-kicks':'bicycle-crunch','leg-raises':'reverse-crunch','toe-touches':'bicycle-crunch','russian-twist':'bicycle-crunch','v-sit':'bicycle-crunch','crunch-hold':'reverse-crunch','cross-crunch':'bicycle-crunch','sit-up':'reverse-crunch','plank-taps':'plank','plank-hip-dips':'side-plank','plank-walkout':'push-up','superman':'forward-fold','bear-hold':'bird-dog','bear-crawl':'mountain-climber','reverse-lunge':'lunge','side-lunge':'lunge','wall-sit':'squat','pushup-knees':'push-up','tempo-squat':'squat','good-morning':'forward-fold','standing-torso':'standing','standing-knee-crunch':'knee-lift','cat-cow':'bird-dog','child-pose':'forward-fold','hip-circles':'standing','shoulder-rolls':'standing','step-back-burpee':'push-up','windshield-wipers':'reverse-crunch','seated-leg-lifts':'reverse-crunch'
 });
 const asset=imageById[id]||'standing';
 return `<img class="exercise-photo" src="./${asset}.webp" alt="${esc(e?.name||'Übung')}" loading="eager" onerror="this.onerror=null;this.outerHTML='<div class=\\"image-fallback\\"><span>↻</span><strong>Übungsillustration</strong><small>Für diese Übung ist gerade kein Bild verfügbar.</small></div>'">`;
}

n.','Becken anheben, bis Schulter, Hüfte und Knie ungefähr eine Linie bilden.','Gesäß anspannen und Wirbel für Wirbel kontrolliert absenken.'],'plank':['Ellbogen unter den Schultern aufsetzen.','Bauch und Gesäß anspannen; Kopf, Rücken und Hüfte bilden eine Linie.','Nicht durchhängen oder das Becken zu hoch schieben.'],'mountain':['Hoher Stütz: Hände unter den Schultern, Körper stabil.','Ein Knie kontrolliert Richtung Brust führen.','Seiten wechseln, ohne das Becken stark auf und ab zu bewegen.'],'bicycle':['Rückenlage, Hände nur leicht an den Kopf legen.','Schulterblätter anheben und den Oberkörper sanft drehen.','Gegengleichen Ellbogen und Knie annähern; nicht am Nacken ziehen.'],'reverse':['Rückenlage, Knie angewinkelt und Bauch anspannen.','Becken sanft vom Boden einrollen, ohne Schwung zu holen.','Langsam absenken und den unteren Rücken kontrolliert halten.'],'side-plank':['Seitlich auf den Unterarm stützen, Ellbogen unter der Schulter.','Hüfte anheben und Körper von Kopf bis Fuß ausrichten.','Leichter: unteres Knie am Boden lassen; nicht in die Schulter sinken.'],'skater':['Knie weich und Oberkörper leicht nach vorn neigen.','Seitlich auf einen Fuß treten, das andere Bein locker dahinterführen.','Leise landen und kontrolliert die Seite wechseln.'],'stretchside':['Beide Füße stabil am Boden lassen.','Einen Arm heben und den Oberkörper sanft zur Gegenseite neigen.','Nicht nach vorn drehen und ruhig weiteratmen.'],'hipstretch':['In einen kurzen Ausfallschritt gehen und Oberkörper aufrecht halten.','Becken sanft nach vorn bewegen, bis die Dehnung vorn an der Hüfte spürbar ist.','Kein Hohlkreuz erzwingen; Seite anschließend wechseln.'],'backmob':['Füße hüftbreit und Knie leicht beugen.','Aus der Hüfte nach vorn neigen und Arme locker hängen lassen.','Langsam aufrichten, ohne ruckartig an den Rücken zu ziehen.'],'coolwalk':['Locker und aufrecht gehen.','Arme entspannt mitschwingen und Atem beruhigen.','Tempo allmählich reduzieren.'],'burpee':['In die Hocke gehen und Hände stabil aufsetzen.','Füße kontrolliert nach hinten setzen und in den Stütz kommen.','Zurück nach vorn steigen und aufrichten; Anfänger verzichten auf den Sprung.']
 };
 const generic=['Stelle dich stabil auf und halte den Nacken locker.','Führe die Bewegung langsam und kontrolliert aus.','Atme gleichmäßig und vermeide ruckartige Bewegungen.'];
 const steps=tips[e?.id]||generic;
 const tip=(e?.id==='plank'||e?.id==='mountain')?'Tipp: Wenn der Rücken durchhängt, kürzere Intervalle wählen oder die Hände erhöht abstützen.':(e?.id==='squat'||e?.id==='squat-reach')?'Tipp: Die Knie folgen der Richtung der Zehen; nur so tief gehen, wie es schmerzfrei möglich ist.':(e?.id==='deadbug'||e?.id==='bicycle'||e?.id==='reverse')?'Tipp: Qualität vor Tempo – Nacken locker halten und nicht mit Schwung arbeiten.':'Tipp: Bewege dich schmerzfrei und in einem Tempo, bei dem du die Haltung kontrollieren kannst.';
 return {steps,tip};
}

function focusPool(focus,level){let pool=exercises.filter(e=>e.focus==='core'||e.focus==='full'||e.focus==='cardio');if(level==='Anfänger')pool=pool.filter(e=>e.low);if(focus==='Core')pool=pool.filter(e=>e.focus==='core');if(focus==='Cardio + Core')pool=pool.filter(e=>e.focus==='core'||e.focus==='cardio');return pool}
function shuffled(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makePlan({duration=20,pause=15,level='Anfänger',focus='Core + Ganzkörper',warmup=2,cooldown=3,challenge=false,day=1}={}){
 let total=duration*60,w=warmup*60,c=cooldown*60,main=total-w-c;if(main<60)throw Error('Für Aufwärmen, Hauptteil und Cool-down bleibt zu wenig Zeit. Bitte Dauer oder Aufwärm-/Cool-down-Zeit anpassen.');
 let target=level==='Anfänger'?35:level==='Fortgeschritten'?40:45;
 let pool=focusPool(focus,level);if(pool.length<4&&focus!=='Core')pool=focusPool('Core + Ganzkörper',level);pool=shuffled(pool);
 // Count is derived from the actual main-part seconds and chosen rest duration.
 // A 36-minute workout with 2 min warm-up, 3 min cool-down and 15 s rests now produces ~38 exercises.
 let n=Math.max(2,Math.min(60,Math.round((main+pause)/(target+pause))));
 while(n>2&&main-(n-1)*pause<n*12)n--;
 let active=main-(n-1)*pause;if(active<=0)throw Error('Mit dieser Pausenlänge ist kein sinnvoller Hauptteil möglich.');
 let base=Math.floor(active/n),rem=active%n;let durations=Array.from({length:n},(_,i)=>base+(i<rem?1:0));
 let chosen=[];let lastFocus='';for(let i=0;i<n;i++){let roundStart=Math.floor(i/pool.length)*pool.length;let usedIds=chosen.slice(roundStart).map(x=>x.id);let candidates=pool.filter(e=>!usedIds.includes(e.id));if(!candidates.length)candidates=[...pool];let best=candidates.find(e=>e.focus!==lastFocus)||candidates[0];chosen.push(best);lastFocus=best.focus;}
 // Challenge days use a day-specific emphasis while keeping recovery days genuinely light.
 const routine=challenge?getChallengeRoutine(day,level):null;
 if(routine?.rest){chosen=Array.from({length:Math.max(3,Math.min(6,Math.floor(main/((target+pause)))) )},(_,i)=>exercises.find(e=>e.id===['march','sidestep','coolwalk','stretchside','backmob','arms'][i%6])).filter(Boolean);n=chosen.length;active=main-(n-1)*pause;durations=Array.from({length:n},(_,i)=>Math.floor(active/n)+(i<active%n?1:0));}
 const warmIds=['boxing-march','march','arms','sidestep','kneelift'];const coolIds=['stretchside','hipstretch','backmob','child-pose','cat-cow'];
 function phase(ids,seconds,minCount,maxCount,kind){let count=Math.max(minCount,Math.min(maxCount,Math.round(seconds/45)));count=Math.min(count,ids.length);let base=Math.floor(seconds/count),r=seconds%count;return ids.slice(0,count).map((id,i)=>({...exercises.find(e=>e.id===id),seconds:base+(i<r?1:0),phase:kind}));}
 // Für Core maximal zwei kurze Warm-up-Übungen, anschließend ausschließlich Core und zum Abschluss 3–4 Dehn-/Mobilitätsübungen.
 const warmCount=Math.min(2,Math.max(1,Math.round(w/60)));
 const warm=phase(warmIds,w,warmCount,warmCount,'warm');
 const coolCount=Math.min(4,Math.max(3,Math.round(c/60)+2));
 const cool=phase(coolIds,c,coolCount,coolCount,'cool');
 // Seitenübungen werden als vollständiges Paar eingeplant. Wird eine Seite gewählt,
 // ergänzen wir die Gegenseite direkt daneben und verteilen die aktive Zeit neu.
 const sidePairs=[['side-leg-raise-left','side-leg-raise-right'],['kneeling-side-plank-left','kneeling-side-plank-right']];
 for(const pair of sidePairs){
   const leftEx=exercises.find(e=>e.id===pair[0]), rightEx=exercises.find(e=>e.id===pair[1]);
   const left=chosen.findIndex(e=>e.id===pair[0]), right=chosen.findIndex(e=>e.id===pair[1]);
   if(left>=0 && right<0 && rightEx) chosen.splice(left+1,0,rightEx);
   else if(right>=0 && left<0 && leftEx) chosen.splice(right,0,leftEx);
   let li=chosen.findIndex(e=>e.id===pair[0]), ri=chosen.findIndex(e=>e.id===pair[1]);
   if(li>=0&&ri>=0&&ri!==li+1){const [r]=chosen.splice(ri,1);li=chosen.findIndex(e=>e.id===pair[0]);chosen.splice(li+1,0,r);}
 }
 n=chosen.length;active=main-(n-1)*pause;
 if(active<n*8) { active=n*8; }
 let pairBase=Math.floor(active/n),pairRem=active%n;
 durations=Array.from({length:n},(_,i)=>pairBase+(i<pairRem?1:0));
 const mainItems=chosen.map((e,i)=>({...e,seconds:durations[i],phase:'main'}));
 const items=[...warm];mainItems.forEach((e,i)=>{items.push(e);if(i<mainItems.length-1&&pause>0)items.push({id:'rest-'+i,name:'Pause',focus:'rest',emoji:'⏸️',inst:'Atme ruhig und bereite dich auf die nächste Übung vor.',seconds:pause,phase:'rest'});});items.push(...cool);
 // Countdown is overlaid on the final seconds of an existing pause or warmup, never adds time.
 return {duration,pause,level,focus,warmup,cooldown,items,totalSeconds:items.reduce((s,e)=>s+e.seconds,0),challenge,day};
}
function getChallengeRoutine(day,level){const d=((day-1)%30)+1;const restDays=level==='Anfänger'?[4,7,10,14,18,21,24,28]:level==='Fortgeschritten'?[7,12,16,20,24,28]:[5,10,15,20,24,28];return {rest:restDays.includes(d),focus:d%3===0?'Core + Ganzkörper':d%3===1?'Core':'Cardio + Core'};}

 const asset=map[id]||'standing'; const src='./'+asset+'.webp';
 const desc=esc(e?.inst||'Bewege dich kontrolliert und atme ruhig.');
 return `<div class="exercise-guide"><div class="exercise-guide-step"><img src="${src}" alt="Darstellung zur Übung ${esc(e.name)}" onerror="this.onerror=null;this.style.display='none';this.insertAdjacentHTML('afterend','<div style=\'padding:20px;text-align:center;color:#72ff42\'>Passendes Bild folgt</div>')"><div class="exercise-guide-caption"><strong><span class="step-num">1</span>Ausgangsposition</strong><p>${desc}</p></div></div><div class="exercise-guide-step"><div style="min-height:clamp(112px,30vw,190px);display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;color:#c7d8ce;background:#101c17"><div><div style="font-size:28px;color:#72ff42;margin-bottom:8px">↔</div><strong>Bewegungsablauf</strong><p style="font-size:12px;line-height:1.45">Folge der Schritt-für-Schritt-Anleitung unten. Eine zweite, geprüfte Pose wird ergänzt, sobald sie für diese Übung vorliegt.</p></div></div><div class="exercise-guide-caption"><strong><span class="step-num">2</span>Bewegung</strong><p>${desc}</p></div></div></div>`;
}
function renderLive(){clearInterval(timerId);if(!state.active){renderHome();return}const a=state.active,p=a.plan,e=currentItem();if(!e){finishWorkout();return}const mainItems=p.items.filter(x=>x.phase==='main'),completedMain=p.items.slice(0,a.index).filter(x=>x.phase==='main').length,progress=Math.round(completedMain/Math.max(1,mainItems.length)*100),phase=e.phase==='warm'?'AUFWÄRMEN':e.phase==='cool'?'COOL-DOWN':e.phase==='rest'?'PAUSE':e.phase==='prep'?'VORBEREITUNG':'ÜBUNG '+(mainIndex(p,a.index)+1)+' VON '+mainItems.length;const next=p.items.slice(a.index+1).find(x=>x.phase!=='rest')||p.items[a.index+1];const imageFor=x=>{const html=exerciseVisual(x);const m=html.match(/src="([^"]+)"/);return m?m[1]:'./standing.webp'};view.innerHTML=`<div class="live-screen"><div class="live"><div class="live-heading"><div><div class="live-mark">BAUCHFIT 1.0</div><div class="live-name">${esc(p.challenge?'Bauch – Tag '+p.day:'Individuelles Training')}</div><div class="live-meta">${completedMain} von ${mainItems.length} Übungen · ca. ${Math.max(1,Math.round(p.totalSeconds/60))} Min.</div></div><span class="pill">${esc(p.level)}</span></div><div class="spread"><span class="small muted">${esc(phase)}</span><span class="small muted">${progress} %</span></div><div class="live-progress"><span style="width:${progress}%"></span></div><div class="live-content-grid"><div class="live-main"><div class="exercise-art ${e.phase==='rest'?'rest-art':''}">${exerciseVisual(e)}</div><div class="live-title-row"><div class="eyebrow">AKTUELLE ÜBUNG</div><h2>${esc(e.name)}</h2><div class="timer" id="timerText">${fmt(a.remaining)}</div></div><div id="pauseBanner" class="pause-banner ${a.paused?'':'hidden'}">Training pausiert</div><div class="live-instruction"><strong>So führst du die Übung aus</strong>${esc(e.inst)}</div>${next?`<div class="next-exercise"><img src="${imageFor(next)}" alt="" onerror="this.src='./standing.webp'"><div><div class="next-label">NÄCHSTE ÜBUNG</div><strong>${esc(next.name)}</strong><small>${fmt(next.seconds)} · Vorbereitung inklusive</small></div></div>`:''}<div class="timer-card"><div class="stats"><div class="stat"><strong>${fmt(p.pause||15)}</strong><span>Pause</span></div><div class="stat"><strong id="elapsedText">${fmt(a.elapsed)}</strong><span>Absolviert</span></div><div class="stat"><strong id="remainingText">${fmt(Math.max(0,p.totalSeconds-a.elapsed))}</strong><span>Verbleibend</span></div></div></div><div class="live-actions"><button class="btn secondary" data-action="skip">⏭<br>Überspringen</button><button class="btn" data-action="pause">${a.paused?'▶':'Ⅱ'}<br>${a.paused?'Fortsetzen':'Pause'}</button><button class="btn secondary" data-action="end">■<br>Abbrechen</button></div></div><aside class="live-sidebar"><button class="live-list-toggle" data-action="toggle-plan-list">☷ Trainingsliste <span class="list-count">${mainItems.length} Übungen　⌄</span></button><div class="live-plan-list hidden" id="livePlanList">${p.items.map((x,i)=>({x,i})).filter(o=>o.x.phase!=='rest'&&o.x.phase!=='prep').map(({x,i})=>`<div class="live-plan-item ${i===a.index?'current':''}"><span class="plan-num">${p.items.slice(0,i+1).filter(y=>y.phase==='main').length||'•'}</span><img src="${imageFor(x)}" alt="" loading="lazy" onerror="this.src='./standing.webp'"><div class="plan-copy"><strong>${esc(x.name)}</strong><small>${x.phase==='warm'?'Aufwärmen':x.phase==='cool'?'Cool-down':esc(x.focus||'Bauch')} · ${fmt(x.seconds)}</small></div></div>`).join('')}</div><section class="technique-card"><h3>Technik-Tipp</h3><ol>${exerciseTechnique(e).steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="form-tip">${esc(exerciseTechnique(e).tip)}</div></section></aside></div><p class="small safety-note">Bei Schmerzen, Schwindel oder ungewöhnlicher Atemnot bitte pausieren oder das Training beenden.</p></div></div>`;if(!a.paused){a.lastTick=Date.now();timerId=setInterval(tick,250)}}
function mainIndex(p,index){return p.items.slice(0,index+1).filter(x=>x.phase==='main').length-1}
function tick(){const a=state.active;if(!a||a.paused)return;const now=Date.now();const delta=(now-a.lastTick)/1000;a.lastTick=now;if(delta<=0)return;const previousRemaining=a.remaining;a.remaining-=delta;a.elapsed+=delta;
if(state.settings.countdown&&state.settings.sound&&a.remaining>0&&a.remaining<=3&&Math.ceil(previousRemaining)>Math.ceil(a.remaining)){const count=Math.ceil(a.remaining);beep();speakCount(count);}
if(a.remaining<=0){a.index++;if(a.index>=a.plan.items.length){clearInterval(timerId);finishWorkout();return}a.remaining=a.plan.items[a.index].seconds;if(state.settings.sound)beep();if(state.settings.countdown&&a.plan.items[a.index].phase!=='rest'&&a.plan.items[a.index].seconds>=3)a.countdown=3;else a.countdown=0;save();renderLive();return;}const t=$('#timerText');if(t){const item=currentItem();t.textContent=(state.settings.countdown&&item&&['main','rest','warm','cool','prep'].includes(item.phase)&&a.remaining<=3&&a.remaining>0)?String(Math.ceil(a.remaining)):fmt(a.remaining);}const banner=$('#pauseBanner');if(banner)banner.classList.toggle('hidden',!a.paused);const elapsedEl=$('#elapsedText');if(elapsedEl)elapsedEl.textContent=fmt(a.elapsed);const remainingEl=$('#remainingText');if(remainingEl)remainingEl.textContent=fmt(a.remaining);const prog=view.querySelector('.live-progress span');if(prog)prog.style.width=Math.min(100,a.elapsed/a.plan.totalSeconds*100)+'%';if(Math.floor(a.remaining)%5===0)save();}
function beep(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.value=.045;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.12)}catch(e){}}
function speakCount(n){try{if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(n));u.lang='de-DE';u.rate=1.05;u.volume=.85;window.speechSynthesis.speak(u)}catch(e){}}
function finishWorkout(){clearInterval(timerId);const a=state.active;if(!a)return;const p=a.plan;const record={timestamp:Date.now(),duration:p.totalSeconds,title:p.challenge?`Challenge Tag ${p.day}`:p.focus,focus:p.focus,level:p.level,day:p.day||null};if(p.challenge){markDayDone(p.day,p.level||state.challenge.level);state.challenge.history.push(record);}else{state.individual.done++;state.individual.history.push(record);}state.active=null;save();view.innerHTML=`<div class="result"><div class="trophy">🏆</div><div class="eyebrow">Geschafft!</div><h2>Training abgeschlossen</h2><p class="muted">Stark gemacht. Dein vollständiges Training wurde gespeichert.</p><div class="stats" style="text-align:left;margin:22px 0"><div class="stat"><strong>${fmt(p.totalSeconds)}</strong><span>Trainingszeit</span></div><div class="stat"><strong>${p.items.filter(x=>x.phase==='main').length}</strong><span>Übungen</span></div><div class="stat"><strong>${p.challenge?'Challenge':'Individuell'}</strong><span>Trainingsart</span></div></div><button class="btn" data-go="home">Zur Startseite</button> <button class="btn secondary" data-go="history">Verlauf ansehen</button></div>`;}
function togglePause(){const a=state.active;if(!a)return;a.paused=!a.paused;if(!a.paused)a.lastTick=Date.now();save();renderLive()}
function skip(){const a=state.active;if(!a)return;if(a.index>=a.plan.items.length-1){const item=currentItem();if(item&&item.phase==='cool'){toast('Bitte den Cool-down vollständig beenden, damit das Training als abgeschlossen zählt.');return}endWorkout();return}a.index++;a.remaining=a.plan.items[a.index].seconds;save();if(state.settings.sound)beep();renderLive()}
function endWorkout(){if(!state.active)return;if(confirm('Training jetzt beenden? Diese Einheit zählt nicht als abgeschlossen. Du kannst sie später fortsetzen oder verwerfen.')){clearInterval(timerId);state.active.paused=true;save();renderHome()}}
function exportData(){const blob=new Blob([JSON.stringify({app:'BauchFit',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='BauchFit_Sicherung_'+dateKey()+'.json';a.click();URL.revokeObjectURL(url);toast('Sicherungsdatei wurde erstellt.')}
function importFile(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const incoming=parsed.state||parsed;if(!incoming.settings||!incoming.challenge||!incoming.individual)throw Error('Ungültiges Format');if(!confirm('Die vorhandenen lokalen Daten durch die Sicherung ersetzen?'))return;state={...structuredClone(defaultState),...incoming,settings:{...defaultState.settings,...incoming.settings},challenge:{...defaultState.challenge,...incoming.challenge},individual:{...defaultState.individual,...incoming.individual}};save();toast('Daten wiederhergestellt.');renderHome()}catch(err){alert('Die Datei konnte nicht importiert werden. Bitte wähle eine gültige BauchFit-Sicherung.')}};reader.readAsText(file);}
function startChallenge(day){const level=state.challenge.level;const routine=getChallengeRoutine(day,level);const duration=20,warmup=state.settings.warmup,cooldown=state.settings.cooldown;let plan=makePlan({duration,pause:level==='Anfänger'?15:20,level,focus:routine.focus,warmup,cooldown,challenge:true,day});
// Progression des statischen Haltevermögens: Steigerung in 5-Sekunden-Schritten
// über die Challenge. Level bestimmt die Startdauer; Anfänger können die Knie-Variante nutzen.
if(!routine.rest){
 const levelBase=level==='Anfänger'?20:level==='Fortgeschritten'?35:45;
 const progression=Math.floor((day-1)/3)*5;
 const holdIds=['plank','knee-plank','side-plank','kneeling-side-plank-left','kneeling-side-plank-right','hollow-hold','crunch-hold','glute-bridge-hold'];
 plan.items=plan.items.map(item=>{
   if(item.phase!=='main'||!holdIds.includes(item.id)) return item;
   let base=levelBase;
   if(item.id==='plank' && level==='Anfänger') base=20;
   if(item.id==='knee-plank') base=level==='Anfänger'?20:level==='Fortgeschritten'?30:40;
   const seconds=Math.min(90,base+progression);
   return {...item,seconds,progressionLevel:level,progressionDay:day};
 });
 plan.totalSeconds=plan.items.reduce((sum,item)=>sum+item.seconds,0);
}
if(routine.rest){plan.focus='Erholung';plan.items=plan.items.map(e=>e.phase==='main'?{...e,focus:'recovery',name:({march:'Locker marschieren',arms:'Sanfte Armkreise',sidestep:'Lockere Seitwärtsschritte',kneelift:'Leichtes Knieheben'})[e.id]||e.name,inst:'Bewege dich entspannt und ohne Druck. Du solltest problemlos sprechen können.'}:e);plan.items=plan.items.filter(e=>e.phase!=='rest');const mainItems=plan.items.filter(e=>e.phase==='main');const mainSec=duration*60-warmup*60-cooldown*60;const activeSec=mainSec;let base=Math.floor(activeSec/mainItems.length),rem=activeSec%mainItems.length;let k=0;plan.items=plan.items.map(e=>e.phase==='main'?{...e,seconds:base+(k++<rem?1:0)}:e);plan.totalSeconds=plan.items.reduce((s,e)=>s+e.seconds,0);plan.pause=0;}plan.items.unshift({id:'prep-countdown',name:'Vorbereitung',focus:'prep',emoji:'⏳',inst:'Stelle dich bereit. Das Training beginnt in 10 Sekunden.',seconds:10,phase:'prep'});
plan.totalSeconds=plan.items.reduce((sum,item)=>sum+item.seconds,0);
startWorkout(plan,{type:'challenge',day});}
function onClick(e){const go=e.target.closest('[data-go]')?.dataset.go;if(go){if(go==='home')renderHome();if(go==='challenge')renderChallenge();if(go==='generator')renderGenerator();if(go==='settings')renderSettings();if(go==='history')renderHistory();if(go==='exercises')renderExercises();return}const exfilter=e.target.closest('[data-exfilter]');if(exfilter){const f=exfilter.dataset.exfilter;view.querySelectorAll('[data-exfilter]').forEach(b=>b.classList.toggle('active',b===exfilter));view.querySelectorAll('[data-exgroup]').forEach(g=>g.classList.toggle('hidden',f!=='Alle'&&g.dataset.exgroup!==f));return}const exbtn=e.target.closest('[data-exercise]');if(exbtn&&!e.target.closest('[data-action]')){renderExerciseDetail(exbtn.dataset.exercise);return}const dayBtn=e.target.closest('.day[data-day]');if(dayBtn){selectedDay=+dayBtn.dataset.day;const routine=getChallengeRoutine(selectedDay,state.challenge.level);const title=$('#dayTitle'),desc=$('#dayDescription'),start=view.querySelector('[data-action="start-challenge"]');if(title)title.textContent='Tag '+selectedDay;if(desc)desc.textContent=routine.rest?'Aktive Erholung: lockere Bewegung und Mobilität, ohne intensive Belastung.':`${routine.focus} · 20 Minuten inklusive Aufwärmen und Cool-down.`;if(start)start.dataset.day=selectedDay;return}const act=e.target.closest('[data-action]')?.dataset.action;if(!act)return;switch(act){case 'level-home':state.challenge.level=e.target.closest('[data-action]').dataset.level;save();renderHome();break;case 'show-recovery':toast('Erholungstag: lockere Bewegung und Mobilität.');break;case 'single-exercise':{const ex=exercises.find(x=>x.id===e.target.closest('[data-action]').dataset.exercise);if(ex){const restItem={id:'rest',name:'Pause',focus:'warm',levels:['Anfänger','Fortgeschritten','Expert'],emoji:'⏱️',inst:'Erhole dich 15 Sekunden. Atme ruhig und bereite dich auf die nächste Übung vor.',seconds:15,phase:'rest'};const plan={duration:30,pause:15,level:state.challenge.level,focus:ex.focus,items:[{...ex,seconds:30,phase:'main'},restItem],totalSeconds:45,challenge:false};startWorkout(plan,{type:'individual'});}break;}case 'generate':try{const plan=makeCurrentPlan();showPreview(plan)}catch(err){toast(err.message)}break;case 'reset-generator':renderGenerator();break;case 'start-preview':if(previewPlan)startWorkout(previewPlan,{type:'individual'});break;case 'edit-plan':$('#previewSection')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'});break;case 'start-challenge':startChallenge(+(e.target.closest('[data-action]')?.dataset.day||nextDay(state.challenge.level)));break;case 'resume':if(state.active){state.active.paused=false;state.active.lastTick=Date.now();renderLive()}break;case 'discard':if(confirm('Gespeichertes Training wirklich verwerfen?')){state.active=null;save();renderHome()}break;case 'pause':togglePause();break;case 'toggle-plan-list':$('#livePlanList')?.classList.toggle('hidden');break;case 'skip':skip();break;case 'end':endWorkout();break;case 'live-exit':if(state.active){state.active.paused=true;save();renderHome()}break;case 'export':exportData();break;case 'import':$('#importFile').click();break;case 'reset-data':if(confirm('Wirklich alle BauchFit-Daten auf diesem Gerät löschen?')){clearInterval(timerId);localStorage.removeItem(STORE);state=structuredClone(defaultState);renderHome();toast('Lokale Daten gelöscht.')}break;}}
view.addEventListener('click',onClick);view.addEventListener('change',e=>{if(e.target.id==='challengeLevel'){state.challenge.level=e.target.value;save();renderChallenge()}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
if(state.active){state.active.paused=true;save();renderHome()}else renderHome();
})();
