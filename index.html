function focusPool(focus,level){let pool=exercises.filter(e=>e.focus==='core'||e.focus==='full'||e.focus==='cardio');if(level==='Anfänger')pool=pool.filter(e=>e.low);if(focus==='Core')pool=pool.filter(e=>e.focus==='core'||e.focus==='full');if(focus==='Cardio + Core')pool=pool.filter(e=>e.focus==='core'||e.focus==='cardio');return pool}
function shuffled(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makePlan({duration=20,pause=15,level='Anfänger',focus='Core + Ganzkörper',warmup=2,cooldown=3,challenge=false,day=1}={}){
 let total=duration*60,w=warmup*60,c=cooldown*60,main=total-w-c;if(main<60)throw Error('Für Aufwärmen, Hauptteil und Cool-down bleibt zu wenig Zeit. Bitte Dauer oder Aufwärm-/Cool-down-Zeit anpassen.');
 let lo=level==='Anfänger'?25:level==='Fortgeschritten'?30:35,hi=level==='Anfänger'?40:level==='Fortgeschritten'?45:50;
 let pool=focusPool(focus,level);if(pool.length<4)pool=focusPool('Core + Ganzkörper',level);pool=shuffled(pool);
 let n=Math.max(3,Math.min(24,Math.floor((main+pause)/(lo+pause))));
 // Choose exercise count that allows active intervals within the selected level range when possible.
 const feasible=[];for(let k=3;k<=24;k++){let active=main-(k-1)*pause;if(active>=k*lo&&active<=k*hi)feasible.push({k,active,score:Math.abs(k-Math.round(main/((lo+hi)/2+pause)))});}if(feasible.length)n=feasible.sort((a,b)=>a.score-b.score)[0].k;else n=Math.max(2,Math.min(24,Math.floor((main+pause)/(lo+pause))));
 while(n>2&&main-(n-1)*pause<n*10)n--;
 let active=main-(n-1)*pause;if(active<=0)throw Error('Mit dieser Pausenlänge ist kein sinnvoller Hauptteil möglich.');
 let base=Math.floor(active/n),rem=active%n;let durations=Array.from({length:n},(_,i)=>base+(i<rem?1:0));
 let chosen=[];let lastFocus='';for(let i=0;i<n;i++){let candidates=pool.filter(e=>!chosen.some(x=>x.id===e.id));if(!candidates.length){chosen=[];candidates=[...pool]}let best=candidates.find(e=>e.focus!==lastFocus)||candidates[0];chosen.push(best);lastFocus=best.focus;}
 // Challenge days use a day-specific emphasis while keeping recovery days genuinely light.
 const routine=challenge?getChallengeRoutine(day,level):null;
 if(routine?.rest){chosen=Array.from({length:Math.max(3,Math.min(6,Math.floor(main/((lo+pause)))) )},(_,i)=>exercises.find(e=>e.id===['march','sidestep','coolwalk','stretchside','backmob','arms'][i%6])).filter(Boolean);n=chosen.length;active=main-(n-1)*pause;durations=Array.from({length:n},(_,i)=>Math.floor(active/n)+(i<active%n?1:0));}
 const warmIds=['march','arms','sidestep','kneelift'];const coolIds=['coolwalk','stretchside','hipstretch','backmob'];
 function phase(ids,seconds){let count=Math.min(ids.length,Math.max(2,Math.round(seconds/45)));let base=Math.floor(seconds/count),r=seconds%count;return ids.slice(0,count).map((id,i)=>({...exercises.find(e=>e.id===id),seconds:base+(i<r?1:0),phase:id==='coolwalk'||id==='stretchside'||id==='hipstretch'||id==='backmob'?'cool':'warm'}));}
 const warm=phase(warmIds,w),cool=phase(coolIds,c);
 const mainItems=chosen.map((e,i)=>({...e,seconds:durations[i],phase:'main'}));
 const items=[...warm];mainItems.forEach((e,i)=>{items.push(e);if(i<mainItems.length-1&&pause>0)items.push({id:'rest-'+i,name:'Pause',focus:'rest',emoji:'⏸️',inst:'Atme ruhig und bereite dich auf die nächste Übung vor.',seconds:pause,phase:'rest'});});items.push(...cool);
 // Countdown is overlaid on the final seconds of an existing pause or warmup, never adds time.

}
function getChallengeRoutine(day,level){const d=((day-1)%30)+1;const restDays=level==='Anfänger'?[4,7,10,14,18,21,24,28]:level==='Fortgeschritten'?[7,12,16,20,24,28]:[5,10,15,20,24,28];return {rest:restDays.includes(d),focus:d%3===0?'Core + Ganzkörper':d%3===1?'Core':'Cardio + Core'};}

function endWorkout(){if(!state.active)return;if(confirm('Training jetzt beenden? Diese Einheit zählt nicht als abgeschlossen. Du kannst sie später fortsetzen oder verwerfen.')){clearInterval(timerId);state.active.paused=true;save();renderHome()}}
function exportData(){const blob=new Blob([JSON.stringify({app:'BauchFit',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='BauchFit_Sicherung_'+dateKey()+'.json';a.click();URL.revokeObjectURL(url);toast('Sicherungsdatei wurde erstellt.')}
function importFile(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const incoming=parsed.state||parsed;if(!incoming.settings||!incoming.challenge||!incoming.individual)throw Error('Ungültiges Format');if(!confirm('Die vorhandenen lokalen Daten durch die Sicherung ersetzen?'))return;state={...structuredClone(defaultState),...incoming,settings:{...defaultState.settings,...incoming.settings},challenge:{...defaultState.challenge,...incoming.challenge},individual:{...defaultState.individual,...incoming.individual}};save();toast('Daten wiederhergestellt.');renderHome()}catch(err){alert('Die Datei konnte nicht importiert werden. Bitte wähle eine gültige BauchFit-Sicherung.')}};reader.readAsText(file);}
function startChallenge(day){const level=state.challenge.level;const routine=getChallengeRoutine(day,level);const duration=20,warmup=state.settings.warmup,cooldown=state.settings.cooldown;let plan=makePlan({duration,pause:level==='Anfänger'?15:20,level,focus:routine.focus,warmup,cooldown,challenge:true,day});if(routine.rest){plan.focus='Erholung';plan.items=plan.items.map(e=>e.phase==='main'?{...e,focus:'recovery',name:({march:'Locker marschieren',arms:'Sanfte Armkreise',sidestep:'Lockere Seitwärtsschritte',kneelift:'Leichtes Knieheben'})[e.id]||e.name,inst:'Bewege dich entspannt und ohne Druck. Du solltest problemlos sprechen können.'}:e);plan.items=plan.items.filter(e=>e.phase!=='rest');const mainItems=plan.items.filter(e=>e.phase==='main');const mainSec=duration*60-warmup*60-cooldown*60;const activeSec=mainSec;let base=Math.floor(activeSec/mainItems.length),rem=activeSec%mainItems.length;let k=0;plan.items=plan.items.map(e=>e.phase==='main'?{...e,seconds:base+(k++<rem?1:0)}:e);plan.totalSeconds=plan.items.reduce((s,e)=>s+e.seconds,0);plan.pause=0;}startWorkout(plan,{type:'challenge',day});}
function onClick(e){const go=e.target.closest('[data-go]')?.dataset.go;if(go){if(go==='home')renderHome();if(go==='challenge')renderChallenge();if(go==='generator')renderGenerator();if(go==='settings')renderSettings();if(go==='history')renderHistory();return}const dayBtn=e.target.closest('.day[data-day]');if(dayBtn){selectedDay=+dayBtn.dataset.day;const routine=getChallengeRoutine(selectedDay,state.challenge.level);const title=$('#dayTitle'),desc=$('#dayDescription'),start=view.querySelector('[data-action="start-challenge"]');if(title)title.textContent='Tag '+selectedDay;if(desc)desc.textContent=routine.rest?'Aktive Erholung: lockere Bewegung und Mobilität, ohne intensive Belastung.':`${routine.focus} · 20 Minuten inklusive Aufwärmen und Cool-down.`;if(start)start.dataset.day=selectedDay;return}const act=e.target.closest('[data-action]')?.dataset.action;if(!act)return;switch(act){case 'generate':try{const plan=makeCurrentPlan();showPreview(plan)}catch(err){toast(err.message)}break;case 'reset-generator':renderGenerator();break;case 'start-preview':if(previewPlan)startWorkout(previewPlan,{type:'individual'});break;case 'edit-plan':$('#previewSection')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'});break;case 'start-challenge':startChallenge(+(e.target.closest('[data-action]')?.dataset.day||nextDay(state.challenge.level)));break;case 'resume':if(state.active){state.active.paused=false;state.active.lastTick=Date.now();renderLive()}break;case 'discard':if(confirm('Gespeichertes Training wirklich verwerfen?')){state.active=null;save();renderHome()}break;case 'pause':togglePause();break;case 'skip':skip();break;case 'end':endWorkout();break;case 'live-exit':if(state.active){state.active.paused=true;save();renderHome()}break;case 'export':exportData();break;case 'import':$('#importFile').click();break;case 'reset-data':if(confirm('Wirklich alle BauchFit-Daten auf diesem Gerät löschen?')){clearInterval(timerId);localStorage.removeItem(STORE);state=structuredClone(defaultState);renderHome();toast('Lokale Daten gelöscht.')}break;}}
view.addEventListener('click',onClick);view.addEventListener('change',e=>{if(e.target.id==='challengeLevel'){state.challenge.level=e.target.value;save();renderChallenge()}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
if(state.active){state.active.paused=true;save();renderHome()}else renderHome();
})();
</script></body></html>
